# Deploys the static build to GitHub Pages on every push to main.
# Repo must be named <username>.github.io (user site) with Pages source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: https://${{ github.event.repository.owner.login }}.github.io
      # The static site lands in .output/public (or dist/client, depending on the build target).
      - id: out
        run: |
          if [ -f .output/public/index.html ]; then echo "dir=.output/public" >> "$GITHUB_OUTPUT";
          else echo "dir=dist/client" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
